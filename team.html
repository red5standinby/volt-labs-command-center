<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Volt Labs — Team HQ (16-bit)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@100;200;300;400;500&display=swap');

        :root {
            --yellow: #EAFF00;
            --accent: #8b5cf6;
            --acc-dim: #6d4fbf;
            --bg: #0a0a12;
            --surface: #12121f;
            --surface2: #1a1a2e;
            --border: #2a2a40;
            --text: #e8e8f0;
            --text-muted: #7878a0;
            --hp-g: #22c55e;
            --hp-y: #eab308;
            --hp-r: #ef4444;
            --mp: #3b82f6;
            --danger: #ef4444;
            --font-mono: 'Press Start 2P', monospace;
            --font-sans: 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-mono);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            image-rendering: pixelated;
            font-size: clamp(7px, 2.2vw, 9px);
            line-height: 1.6;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .layout {
            max-width: 1000px; margin: 0 auto; padding: 12px;
            position: relative; z-index: 1;
        }

        /* ── HEADER BAR ── */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 12px; margin-bottom: 10px;
        }
        .top-bar h1 { font-size: clamp(10px, 3.5vw, 13px); color: var(--yellow); letter-spacing: 0.05em; }
        .top-bar .nav-links { display: flex; gap: 6px; }
        .top-bar .nav-links a {
            padding: 5px 10px; border-radius: 6px; font-size: clamp(7px, 2.2vw, 9px);
            color: var(--text-muted); text-decoration: none; transition: .15s;
            background: var(--surface2);
        }
        .top-bar .nav-links a:hover, .top-bar .nav-links a.active { color: #fff; background: var(--accent); }

        /* ── SCENE (animated overworld) ── */
        .scene-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 6px; margin-bottom: 10px; overflow: hidden;
        }
        .scene-box canvas {
            width: 100%; height: auto; aspect-ratio: 968 / 160;
            display: block; border-radius: 6px; image-rendering: pixelated;
        }

        /* ── PARTY GRID ── */
        .party-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

        .char-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; display: flex; gap: 10px; align-items: flex-start;
            position: relative; overflow: hidden; transition: .15s;
        }
        .char-card.active { border-color: var(--accent); }
        .char-card.standby { opacity: 0.7; }

        .sprite-box {
            width: 42px; height: 63px; flex-shrink: 0;
            background: rgba(0,0,0,.3); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border);
        }
        .sprite-box canvas { width: 42px; height: 63px; image-rendering: pixelated; }

        .char-body { flex: 1; min-width: 0; }
        .char-name { font-size: clamp(9px, 2.8vw, 11px); color: var(--yellow); letter-spacing: 0.05em; }
        .char-class { font-size: clamp(7px, 2.2vw, 8px); color: var(--text-muted); }
        .char-lv { font-size: clamp(7px, 2.2vw, 8px); color: var(--accent); }

        .stat-bars { margin-top: 5px; }
        .stat-row { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
        .stat-label { font-size: clamp(6px, 2vw, 8px); width: 18px; }
        .stat-label.hp { color: var(--hp-g); }
        .stat-label.mp { color: var(--mp); }
        .stat-track { flex: 1; height: clamp(6px, 1.8vw, 8px); background: rgba(255,255,255,.05); border-radius: 4px; overflow: hidden; }
        .stat-fill { height: 100%; border-radius: 4px; transition: width .5s; }
        .stat-fill.hp { background: linear-gradient(90deg, var(--hp-g), #4ade80); }
        .stat-fill.mp { background: linear-gradient(90deg, var(--mp), #60a5fa); }
        .stat-nums { font-size: clamp(6px, 1.8vw, 7px); color: var(--text-muted); min-width: 50px; text-align: right; }

        .atb-row { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
        .atb-label { font-size: clamp(6px, 2vw, 7px); color: var(--yellow); }
        .atb-track { flex: 1; height: clamp(5px, 1.5vw, 6px); background: rgba(255,255,255,.05); border-radius: 3px; overflow: hidden; }
        .atb-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--yellow), #fff566); transition: width .5s; }
        .status-tag { font-size: clamp(6px, 1.8vw, 7px); padding: 2px 6px; border-radius: 10px; white-space: nowrap; }
        .status-tag.ready { background: rgba(34,197,94,.15); color: var(--hp-g); border: 1px solid rgba(34,197,94,.3); }
        .status-tag.standby { background: rgba(120,120,160,.1); color: var(--text-muted); border: 1px solid var(--border); }

        /* Active overlay */
        .char-card.active::after {
            content: '▶ ACTIVE';
            position: absolute; top: 6px; right: 6px;
            font-size: clamp(6px, 1.8vw, 7px); color: var(--hp-g);
            background: rgba(34,197,94,.1);
            padding: 2px 6px; border-radius: 10px;
            border: 1px solid rgba(34,197,94,.2);
        }

        /* ── RESERVE ── */
        .reserve-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; margin-bottom: 10px;
        }
        .reserve-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .reserve-header h3 { font-size: clamp(8px, 2.5vw, 10px); color: var(--yellow); }
        .reserve-header span { font-size: clamp(7px, 2.2vw, 8px); color: var(--text-muted); }
        .reserve-grid { display: flex; gap: 8px; flex-wrap: wrap; }
        .reserve-card {
            display: flex; gap: 8px; align-items: center;
            padding: 8px; border: 1px solid var(--border); border-radius: 8px;
            background: rgba(255,255,255,.02); opacity: 0.6;
            flex: 1; min-width: 160px;
        }
        .reserve-card canvas { width: 30px; height: 45px; image-rendering: pixelated; border-radius: 4px; }

        /* ── CMD + QUEST ── */
        .bottom-grid { display: flex; gap: 8px; margin-bottom: 10px; }
        .bottom-grid > * { flex: 1; }
        .cmd-box, .quest-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px;
        }
        .cmd-title, .quest-title { font-size: clamp(8px, 2.5vw, 10px); color: var(--yellow); margin-bottom: 6px; letter-spacing: 0.05em; }
        .cmd-item {
            padding: 3px 6px; cursor: pointer; border-radius: 4px;
            transition: .1s; font-size: clamp(7px, 2.2vw, 8px); color: var(--text-muted);
        }
        .cmd-item:hover { background: var(--surface2); color: var(--text); }
        .cmd-item.active { color: var(--hp-g); }
        .cmd-item.active .cmd-cursor { animation: blink 0.6s step-end infinite; }
        .cmd-item .cmd-cursor { color: var(--yellow); }
        @keyframes blink { 50% { opacity: 0; } }

        .quest-row { display: flex; gap: 4px; font-size: clamp(7px, 2.2vw, 8px); padding: 2px 0; line-height: 1.6; }
        .quest-num { color: var(--text-muted); min-width: 16px; }
        .quest-done { color: var(--hp-g); }
        .quest-now { color: var(--yellow); }
        .quest-todo { color: var(--text-muted); }

        /* ── DIALOGUE ── */
        .dialog-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; margin-bottom: 10px; min-height: 70px;
            display: flex; gap: 10px; cursor: pointer;
        }
        .dialog-portrait {
            width: 36px; height: 54px; flex-shrink: 0;
            background: rgba(0,0,0,.3); border-radius: 6px;
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
        }
        .dialog-portrait canvas { width: 36px; height: 54px; image-rendering: pixelated; }
        .dialog-text-box { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .dialog-speaker { font-size: clamp(8px, 2.5vw, 9px); color: var(--yellow); margin-bottom: 3px; }
        .dialog-text { font-size: clamp(8px, 2.5vw, 9px); line-height: 1.6; color: var(--text); }
        .dialog-continue {
            margin-top: 6px; font-size: clamp(6px, 1.8vw, 7px); color: var(--text-muted);
            animation: blink 1s step-end infinite;
        }

        /* ── MOBILE ── */
        @media(max-width:640px){
            .layout { padding: 8px; }
            .top-bar { padding: 6px 10px; }
            .char-card { padding: 8px; gap: 8px; }
            .bottom-grid { flex-direction: column; }
            .reserve-card { min-width: 0; }
            .sprite-box { width: 36px; height: 54px; }
            .sprite-box canvas { width: 36px; height: 54px; }
            .char-card.active::after { font-size: 6px; padding: 1px 5px; }
            .dialog-portrait { width: 30px; height: 45px; }
            .dialog-portrait canvas { width: 30px; height: 45px; }
        }
    </style>
</head>

function getSprite(a) {
    let data, pal;
    switch (a.id) {
        case 'chombi': data = CHOMBI_DATA; pal = CHOMBI_PAL; break;
        case 'scout':  data = SCOUT_DATA;  pal = SCOUT_PAL;  break;

        case 'ohm':    data = SCOUT_DATA;  pal = OHM_PAL;    break;
        case 'surge':  data = SCOUT_DATA;  pal = SURGE_PAL;  break;
        default:       data = SCOUT_DATA;  pal = SCOUT_PAL;
    }
    return buildSprite(data, pal);
}

function drawSprite(canvas, sprite) {
    const ctx = canvas.getContext('2d');
    const pw = canvas.width / sprite.w, ph = canvas.height / sprite.h;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let row = 0; row < sprite.h; row++) {
        for (let col = 0; col < sprite.w; col++) {
            const color = sprite.grid[row][col];
            if (!color) continue;
            ctx.fillStyle = color;
            ctx.fillRect(col * pw, row * ph, Math.ceil(pw), Math.ceil(ph));
        }
    }
}

    { x: 80,  y: 100 },
    { x: 200, y: 104 },
    { x: 340, y: 98  },
    { x: 500, y: 102 },
    { x: 640, y: 100 },
];

// Patrol routes — each walker has a home base and wanders in a range
const walkRanges = [
    { minX: 60,  maxX: 160, dir: 1 },
    { minX: 180, maxX: 280, dir: -1 },
    { minX: 310, maxX: 410, dir: 1 },
    { minX: 460, maxX: 560, dir: -1 },
    { minX: 600, maxX: 700, dir: 1 },
];

// Walk cycle frame counter
let walkFrame = 0;

function renderScene() {
    const canvas = document.getElementById('scene-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // ── Background ──
    ctx.fillStyle = '#16162a';
    ctx.fillRect(0, 0, W, H);

    // Path at bottom
    ctx.fillStyle = '#1a1a30';
    ctx.fillRect(0, H-30, W, 30);

    // Subtle ground pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Scenery — trees
    const trees = [
        [30, 15], [85, 22], [155, 12], [215, 26],
        [735, 18], [805, 14], [875, 24], [925, 16]
    ];
    trees.forEach(([x, y]) => {
        ctx.fillStyle = '#0f3f1f';
        ctx.fillRect(x, y, 18, 10);
        ctx.fillStyle = '#1a5f2f';
        ctx.fillRect(x+2, y-5, 14, 8);
    });

    // ── Move walkers ──
    const walkers = AGENTS.filter(a => a.active);
    walkers.forEach((a, i) => {
        const rng = walkRanges[i] || { minX: 80 + i*160 - 60, maxX: 80 + i*160 + 60, dir: 1 };
        const pos = walkerPositions[i] || { x: 80 + i * 160, y: 100 };

        // Move in patrol pattern
        pos.x += rng.dir * 0.6;
        if (pos.x >= rng.maxX) rng.dir = -1;
        if (pos.x <= rng.minX) rng.dir = 1;

        // Draw sprite
        const sprite = getSprite(a);
        const scale = 3;
        const px = Math.round(pos.x);
        const py = pos.y;

        for (let row = 0; row < sprite.h; row++) {
            for (let col = 0; col < sprite.w; col++) {
                const color = sprite.grid[row][col];
                if (!color) continue;
                ctx.fillStyle = color;
                ctx.fillRect(px + col * scale, py + row * scale - 24, scale, scale);
            }
        }

        // Name label
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(px + 8, py + 4, a.name.length * 9 + 8, 14);
        ctx.fillStyle = a.status === 'ready' ? '#22c55e' : '#7878a0';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText(a.name, px + 12, py + 14);
    });

    // Active agents count
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W-180, 6, 172, 22);
    ctx.fillStyle = '#eab308';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText(`PARTY: ${walkers.length} / ${AGENTS.length}`, W-170, 22);
}

// ═══════════════════════════════════════════
//  RENDER PARTY CARDS
// ═══════════════════════════════════════════

function renderParty() {
    const grid = document.getElementById('party-grid');
    grid.innerHTML = '';

    AGENTS.filter(a => a.active).forEach(a => {
        const card = document.createElement('div');
        card.className = `char-card ${a.status === 'ready' ? 'active' : 'standby'}`;

        const sprite = getSprite(a);
        card.innerHTML = `
            <div class="sprite-box">
                <canvas id="s-${a.id}" width="48" height="72"></canvas>
            </div>
            <div class="char-body">
                <div>
                    <span class="char-name">${a.name}</span>
                    <span class="char-lv">Lv ${a.lv}</span>
                </div>
                <div class="char-class">${a.emoji} ${a.role}</div>
                <div class="stat-bars">
                    <div class="stat-row">
                        <span class="stat-label hp">HP</span>
                        <div class="stat-track"><div class="stat-fill hp" style="width:${(a.hp/a.hpMax)*100}%"></div></div>
                        <span class="stat-nums">${a.hp}/${a.hpMax}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label mp">MP</span>
                        <div class="stat-track"><div class="stat-fill mp" style="width:${(a.mp/a.mpMax)*100}%"></div></div>
                        <span class="stat-nums">${a.mp}/${a.mpMax}</span>
                    </div>
                    <div class="atb-row">
                        <span class="atb-label">ATB</span>
                        <div class="atb-track"><div class="atb-fill" style="width:${a.atbPct}%"></div></div>
                        <span class="status-tag ${a.status}">${a.status.toUpperCase()}</span>
                    </div>
                </div>
            </div>
        `;
        grid.appendChild(card);

        setTimeout(() => {
            const cvs = document.getElementById(`s-${a.id}`);
            if (cvs) drawSprite(cvs, getSprite(a));
        }, 50);
    });
}

function renderReserve() {
    const grid = document.getElementById('reserve-grid');
    grid.innerHTML = '';
    AGENTS.filter(a => !a.active).forEach(a => {
        const card = document.createElement('div');
        card.className = 'reserve-card';
        card.innerHTML = `
            <canvas id="r-${a.id}" width="48" height="72"></canvas>
            <div>
                <div style="font-size:9px;color:var(--text-muted);">${a.name}</div>
                <div style="font-size:7px;color:var(--text-muted);">${a.emoji} ${a.role}</div>
            </div>
        `;
        grid.appendChild(card);

        setTimeout(() => {
            const cvs = document.getElementById(`r-${a.id}`);
            if (cvs) drawSprite(cvs, getSprite(a));
        }, 50);
    });
}

function renderQuestLog() {
    const list = document.getElementById('quest-list');
    list.innerHTML = QUESTS.map(q => `
        <div class="quest-row">
            <span class="quest-num">${q.num}</span>
            <span>
                ${q.done ? '<span class="quest-done">★</span>' : q.active ? '<span class="quest-now">▶</span>' : '<span class="quest-todo">○</span>'}
                ${q.text}
            </span>
        </div>
    `).join('');
}

function renderCommands() {
    const list = document.getElementById('command-list');
    list.innerHTML = CMDS.map((c, i) => `
        <div class="cmd-item ${c.active ? 'active' : ''}">
            <span class="cmd-cursor">${c.active ? '▶' : ''}</span>${c.text}
        </div>
    `).join('');
}

function renderDialogue() {
    const chombi = AGENTS[0];
    document.getElementById('dialog-speaker').textContent = chombi.name;
    document.getElementById('dialog-text').textContent = chombi.dialog;
    setTimeout(() => {
        const cvs = document.getElementById('dialog-portrait');
        if (cvs) drawSprite(cvs, getSprite(chombi));
    }, 50);
}

// Click to cycle through agent dialogues
let dialogIdx = 0;
document.getElementById('dialog-box').addEventListener('click', () => {
    dialogIdx = (dialogIdx + 1) % AGENTS.length;
    const a = AGENTS[dialogIdx];
    document.getElementById('dialog-speaker').textContent = a.name;
    document.getElementById('dialog-text').textContent = a.dialog;
    setTimeout(() => {
        const cvs = document.getElementById('dialog-portrait');
        if (cvs) drawSprite(cvs, getSprite(a));
    }, 50);
});

// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════

renderScene();
renderParty();
renderReserve();
renderQuestLog();
renderCommands();
renderDialogue();

// Animate scene every 60ms (≈16fps) for smooth walking
let animFrame = 0;
setInterval(() => {
    animFrame++;
    renderScene();
}, 60);

</script>
</body>
</html>
